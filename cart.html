<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <title>Your Bag | Copy N' Taste</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    .cart-page-section { padding: calc(var(--spacing-xl) + 80px) 0 var(--spacing-xl); }
    .cart-table { width: 100%; border-collapse: collapse; margin-bottom: 3rem; }
    .cart-table th { text-align: left; padding: 1rem; border-bottom: 1px solid var(--muted); font-family: var(--font-body); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.875rem; }
    .cart-table td { padding: 1.5rem 1rem; border-bottom: 1px solid rgba(41,24,23,0.1); vertical-align: middle; }
    .cart-item-info { display: flex; align-items: center; gap: 1.5rem; }
    .cart-item-img-lg { width: 100px; height: 100px; object-fit: cover; border-radius: var(--border-radius-sm); }
    .cart-totals { max-width: 400px; margin-left: auto; background: var(--pink-soft); padding: 2rem; border-radius: var(--border-radius-md); }
    .promo-form { display: flex; margin-bottom: 2rem; }
    .promo-input { flex: 1; padding: 0.75rem; border: 1px solid var(--muted); border-radius: var(--border-radius-sm) 0 0 var(--border-radius-sm); background: transparent; }
    .promo-btn { padding: 0.75rem 1.5rem; background: var(--chocolate); color: var(--cream); border: none; border-radius: 0 var(--border-radius-sm) var(--border-radius-sm) 0; cursor: pointer; }
    
    @media (max-width: 768px) {
      .cart-table thead { display: none; }
      .cart-table, .cart-table tbody, .cart-table tr, .cart-table td { display: block; width: 100%; }
      .cart-table tr { margin-bottom: 1rem; border: 1px solid rgba(41,24,23,0.1); padding: 1rem; border-radius: var(--border-radius-sm); }
      .cart-table td { padding: 0.5rem 0; border: none; text-align: right; }
      .cart-table td:first-child { text-align: left; }
      .cart-item-info { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- Custom Cursor -->
  <div class="custom-cursor"></div>

  <!-- Navbar -->
  <nav class="navbar scrolled">
    <a href="index.html" class="logo"><img src="images/logo.png" alt="Copy N' Taste" class="logo-img"></a>
    <div class="nav-icons">
      <a href="shop.html" class="nav-link">Continue Shopping</a>
    </div>
  </nav>

  <section class="cart-page-section">
    <div class="container">
      <h1 style="margin-bottom: 3rem;">Your Bag</h1>
      
      <div id="full-cart-container">
        <!-- Rendered by JS -->
      </div>
      
    </div>
  </section>

  <!-- Scripts -->
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('full-cart-container');
      const cartData = JSON.parse(localStorage.getItem('cnt_cart')) || [];
      
      if(cartData.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding: 4rem 0;">
            <h3>YOUR CART IS FEELING A LITTLE EMPTY.</h3>
            <p style="margin: 1rem 0 2rem;">Let's fix that.</p>
            <a href="shop.html" class="btn btn-primary">Shop Sweets</a>
          </div>
        `;
        return;
      }
      
      let html = `
        <table class="cart-table">
          <thead>
            <tr>
              <th>Product</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      let subtotal = 0;
      cartData.forEach(item => {
        const total = item.price * item.quantity;
        subtotal += total;
        html += `
          <tr>
            <td>
              <div class="cart-item-info">
                <img src="${item.image}" alt="${item.name}" class="cart-item-img-lg">
                <div>
                  <h4>${item.name}</h4>
                  <button onclick="window.removeFromCart('${item.id}'); location.reload();" style="background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;margin-top:0.5rem;font-size:0.875rem;">Remove</button>
                </div>
              </div>
            </td>
            <td>$${item.price.toFixed(2)}</td>
            <td>
              <div class="quantity-controls">
                <button class="qty-btn" onclick="window.updateQuantity('${item.id}', ${item.quantity - 1}); location.reload();">-</button>
                <span>${item.quantity}</span>
                <button class="qty-btn" onclick="window.updateQuantity('${item.id}', ${item.quantity + 1}); location.reload();">+</button>
              </div>
            </td>
            <td><strong>$${total.toFixed(2)}</strong></td>
          </tr>
        `;
      });
      
      html += `</tbody></table>`;
      
      html += `
        <div class="cart-totals">
          <div class="promo-form">
            <input type="text" class="promo-input" placeholder="Promo Code">
            <button class="promo-btn" onclick="alert('Promo code applied!')">Apply</button>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:1rem;">
            <span>Subtotal</span>
            <span>$${subtotal.toFixed(2)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:2rem;font-size:0.875rem;color:var(--muted);">
            <span>Taxes & Shipping</span>
            <span>Calculated at checkout</span>
          </div>
          <a href="checkout.html" class="btn btn-primary" style="width:100%;">Proceed to Checkout</a>
        </div>
      `;
      
      container.innerHTML = html;
    });
  </script>
</body>
</html>
